name: Release

# สร้างไฟล์โปรแกรม Windows / macOS (Apple Silicon M1 ขึ้นไป) / Linux
# วิธีใช้: Releases → Draft a new release → ตั้ง tag เช่น v0.2.0 → Publish
# หรือ push tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: nhso-claim-windows-x64
          - os: macos-14            # Apple Silicon (M1/M2/M3/M4)
            asset: nhso-claim-macos-arm64
          - os: ubuntu-22.04
            asset: nhso-claim-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: pytest -q
      - run: python build.py
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg/${{ matrix.asset }}
          cp dist/* pkg/${{ matrix.asset }}/
          cp .env.example README.md pkg/${{ matrix.asset }}/
          cp -r examples pkg/${{ matrix.asset }}/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.asset }}.zip ${{ matrix.asset }}
          else
            chmod +x ${{ matrix.asset }}/nhso-claim
            zip -r ../${{ matrix.asset }}.zip ${{ matrix.asset }}
          fi
      # Windows: สร้างตัวติดตั้ง Setup.exe ด้วย Inno Setup เพิ่มจาก zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}" -replace '^v',''
          if ($v -notmatch '^\d') { $v = "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\nhso-claim.iss
          Copy-Item "dist\nhso-claim-setup-$v.exe" "nhso-claim-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            nhso-claim-windows-setup.exe
          if-no-files-found: ignore
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.asset }}.zip
            nhso-claim-windows-setup.exe
