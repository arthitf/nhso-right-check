name: Release

# สร้างไฟล์โปรแกรม Windows / macOS (Apple Silicon M1 ขึ้นไป) / Linux
# วิธีใช้: Releases → Draft a new release → ตั้ง tag เช่น v0.2.0 → Publish
# หรือ push tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
    branches: [main]
    # build ทดสอบเมื่อไฟล์ที่เกี่ยวกับการ build เปลี่ยน (แนบเข้า Release เฉพาะตอนสร้าง tag)
    paths: ["build.py", "launcher.py", "assets/**", "installer/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: nhso-right-check-windows-x64
          - os: macos-latest        # Apple Silicon (M1 ขึ้นไป)
            asset: nhso-right-check-macos-arm64
          - os: ubuntu-22.04
            asset: nhso-right-check-linux-x64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: App window (pywebview) — Windows / macOS
        if: runner.os != 'Linux'
        run: pip install "pywebview>=5.0"
      - run: python -m pytest -q
      - run: python build.py
      - name: Package
        shell: bash
        run: |
          A=pkg/${{ matrix.asset }}
          mkdir -p $A
          case "${{ runner.os }}" in
            Windows) cp dist/nhso-right-check.exe dist/nhso-right-check-cli.exe $A/ && mkdir -p $A/tools && cp nhso_right_check/tools/fix-agent.* $A/tools/ ;;
            macOS)   cp -R dist/nhso-right-check.app $A/ ;;
            *)       cp dist/nhso-right-check $A/ && chmod +x $A/nhso-right-check ;;
          esac
          cp .env.example README.md $A/
          cp -r examples $A/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.asset }}.zip ${{ matrix.asset }}
          else
            zip -r -y ../${{ matrix.asset }}.zip ${{ matrix.asset }}
          fi
      # Windows: สร้างตัวติดตั้ง Setup.exe ด้วย Inno Setup เพิ่มจาก zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}" -replace '^v',''
          if ($v -notmatch '^\d') { $v = "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\nhso-right-check.iss
          Copy-Item "dist\nhso-right-check-setup-$v.exe" "nhso-right-check-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            nhso-right-check-windows-setup.exe
          if-no-files-found: ignore
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.asset }}.zip
            nhso-right-check-windows-setup.exe
